<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Enso</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #000000;
      --text: #ffffff;
      --text-secondary: #a3a3a3;
      --text-muted: #525252;
      --border: #262626;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.6;
      font-weight: 400;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Enso Circle */
    .enso {
      width: 64px;
      height: 64px;
      border: 2px solid var(--text);
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .enso::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 14px;
      height: 14px;
      background: var(--bg);
    }

    .enso:active {
      transform: scale(0.95);
    }

    .enso-small {
      width: 28px;
      height: 28px;
    }

    .enso-small::after {
      width: 7px;
      height: 7px;
    }

    /* Header */
    .header {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Home Screen */
    .home {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 24px;
      text-align: center;
    }

    .home .enso {
      width: 80px;
      height: 80px;
      margin-bottom: 32px;
    }

    .home .enso::after {
      width: 18px;
      height: 18px;
    }

    .prompt {
      font-size: 18px;
      font-weight: 300;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Entry List */
    .entries {
      padding: 0 24px 100px;
    }

    .entries-header {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 32px 0 16px;
    }

    .entry {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .entry:last-child {
      border-bottom: none;
    }

    .entry-date {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .entry-preview {
      font-size: 15px;
      font-weight: 300;
      color: var(--text-secondary);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty {
      text-align: center;
      padding: 60px 24px;
    }

    .empty .enso {
      margin: 0 auto 24px;
      opacity: 0.3;
      cursor: default;
    }

    .empty-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* Write Overlay */
    .write-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .write-overlay.active {
      display: flex;
    }

    .write-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .write-header button {
      background: none;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      padding: 8px;
    }

    .write-header .save {
      font-weight: 500;
    }

    .write-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .write-date {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 24px 24px 12px;
    }

    .write-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 17px;
      line-height: 1.8;
      padding: 0 24px 24px;
      resize: none;
      outline: none;
      font-family: inherit;
      font-weight: 300;
    }

    .write-textarea::placeholder {
      color: var(--text-muted);
    }

    /* View Overlay */
    .view-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: none;
      flex-direction: column;
    }

    .view-overlay.active {
      display: flex;
    }

    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .view-header button {
      background: none;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      padding: 8px;
    }

    .delete-btn {
      color: var(--text-muted) !important;
    }

    .view-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .view-date {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .view-content {
      font-size: 17px;
      font-weight: 300;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* Bottom Nav */
    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 64px;
      padding: 20px 0 36px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--text);
    }

    .nav-item span {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav-icon {
      width: 22px;
      height: 22px;
    }

    /* Screens */
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 12px 24px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Home Screen -->
    <div id="home-screen" class="screen active">
      <header class="header">
        <div class="header-left">
          <div class="enso enso-small"></div>
          <span class="header-title">Enso</span>
        </div>
      </header>

      <div class="home">
        <div class="enso" onclick="openWrite()"></div>
        <p class="prompt">What's on your mind?</p>
        <p class="hint">Tap to write</p>
      </div>
    </div>

    <!-- Journal Screen -->
    <div id="journal-screen" class="screen">
      <header class="header">
        <div class="header-left">
          <div class="enso enso-small"></div>
          <span class="header-title">Journal</span>
        </div>
      </header>

      <div class="entries" id="entries-container"></div>
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <div class="nav-item active" data-tab="home" onclick="switchTab('home')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
        </svg>
        <span>Home</span>
      </div>
      <div class="nav-item" data-tab="journal" onclick="switchTab('journal')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
        </svg>
        <span>Journal</span>
      </div>
    </nav>
  </div>

  <!-- Write Overlay -->
  <div class="write-overlay" id="write-overlay">
    <div class="write-header">
      <button onclick="closeWrite()">Cancel</button>
      <button class="save" onclick="saveEntry()">Done</button>
    </div>
    <div class="write-body">
      <p class="write-date" id="write-date"></p>
      <textarea
        class="write-textarea"
        id="write-textarea"
        placeholder="Begin writing..."
      ></textarea>
    </div>
  </div>

  <!-- View Overlay -->
  <div class="view-overlay" id="view-overlay">
    <div class="view-header">
      <button onclick="closeView()">Back</button>
      <button class="delete-btn" onclick="deleteEntry()">Delete</button>
    </div>
    <div class="view-body">
      <p class="view-date" id="view-date"></p>
      <p class="view-content" id="view-content"></p>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // Storage
    const STORAGE_KEY = 'enso_journal';

    function getEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    // Write
    function openWrite() {
      const overlay = document.getElementById('write-overlay');
      const textarea = document.getElementById('write-textarea');
      const dateEl = document.getElementById('write-date');

      const now = new Date();
      dateEl.textContent = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });

      textarea.value = '';
      overlay.classList.add('active');
      setTimeout(() => textarea.focus(), 100);
    }

    function closeWrite() {
      document.getElementById('write-overlay').classList.remove('active');
    }

    function saveEntry() {
      const textarea = document.getElementById('write-textarea');
      const content = textarea.value.trim();

      if (!content) {
        showToast('Write something first');
        return;
      }

      const entries = getEntries();
      entries.unshift({
        id: Date.now().toString(),
        date: new Date().toISOString(),
        content
      });

      saveEntries(entries);
      closeWrite();
      renderEntries();
      showToast('Saved');
    }

    // View
    let currentEntryId = null;

    function openView(id) {
      const entries = getEntries();
      const entry = entries.find(e => e.id === id);
      if (!entry) return;

      currentEntryId = id;

      const date = new Date(entry.date);
      document.getElementById('view-date').textContent = date.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });
      document.getElementById('view-content').textContent = entry.content;
      document.getElementById('view-overlay').classList.add('active');
    }

    function closeView() {
      document.getElementById('view-overlay').classList.remove('active');
      currentEntryId = null;
    }

    function deleteEntry() {
      if (!currentEntryId) return;
      if (!confirm('Delete this entry?')) return;

      let entries = getEntries();
      entries = entries.filter(e => e.id !== currentEntryId);
      saveEntries(entries);

      closeView();
      renderEntries();
      showToast('Deleted');
    }

    // Render
    function renderEntries() {
      const container = document.getElementById('entries-container');
      const entries = getEntries();

      if (entries.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div class="enso"></div>
            <p class="empty-text">Your journal is empty</p>
          </div>
        `;
        return;
      }

      // Group by month
      const grouped = {};
      entries.forEach(entry => {
        const date = new Date(entry.date);
        const key = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(entry);
      });

      let html = '';
      for (const [month, monthEntries] of Object.entries(grouped)) {
        html += `<p class="entries-header">${month}</p>`;
        monthEntries.forEach(entry => {
          const date = new Date(entry.date);
          const today = new Date();
          const yesterday = new Date(today);
          yesterday.setDate(yesterday.getDate() - 1);

          let dateStr;
          if (date.toDateString() === today.toDateString()) {
            dateStr = 'Today';
          } else if (date.toDateString() === yesterday.toDateString()) {
            dateStr = 'Yesterday';
          } else {
            dateStr = date.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
          }

          html += `
            <div class="entry" onclick="openView('${entry.id}')">
              <p class="entry-date">${dateStr}</p>
              <p class="entry-preview">${escapeHtml(entry.content)}</p>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    // Navigation
    function switchTab(tab) {
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.tab === tab);
      });
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(`${tab}-screen`).classList.add('active');
    }

    // Utilities
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    renderEntries();
  </script>
</body>
</html>
